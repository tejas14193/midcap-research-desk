name: Probe NSE filings
# Manual test only: checks whether GitHub's servers can read result filings from NSE.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/probe-nse.js ASHOKLEY
