name: Deploy Cloudflare timer

# Deploys tools/timer (the Worker that starts "Midcap desk update" at fixed IST times)
# to the owner's personal Cloudflare account whenever its code changes, or by hand.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The Worker's own GH_TOKEN secret is kept by Cloudflare across deploys.
on:
  push:
    branches: [main]
    paths: ["tools/timer/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-timer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the Cloudflare secrets are set
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Test the timer logic
        working-directory: tools/timer
        run: |
          cp worker.js /tmp/w.mjs
          node --input-type=module -e '
            const m = await import("/tmp/w.mjs");
            const want = [["2026-11-16T05:52Z","prices"],["2026-11-16T09:52Z","prices"],["2026-11-21T05:52Z",null],
                          ["2026-11-16T11:40Z","filings"],["2026-11-16T13:40Z","filings"],["2026-11-16T16:09Z","research"],["2026-11-16T05:40Z",null]];
            let bad = 0;
            for (const [t, w] of want) { const g = m.pickMode(Date.parse(t)); if (g !== w) { console.log("WRONG", t, g, "expected", w); bad++; } }
            if (bad) process.exit(1);
            console.log("timer logic OK");'

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/timer
          wranglerVersion: "4"
          command: deploy
