name: Midcap desk update

# No GitHub schedule (removed 18 Nov 2026 at the user's request: it fired hours late and doubled runs).
# Runs are started by the Cloudflare Worker timer in tools/timer (workflow_dispatch):
# price check weekdays 11:22 and 15:22 IST, NSE filings daily 17:10 and 19:10 IST, research daily 21:39 IST.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: research
        options: [prices, filings, research, full, deploy-only, test-email, test-whatsapp, test-telegram]
  push:
    paths: [index.html, engine.js, data.json, prices.json]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: midcap-desk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pick mode
        id: mode
        run: |
          case "${{ github.event_name }}" in
            schedule)
              case "${{ github.event.schedule }}" in
                "9 16 * * *") m=research ;;
                "40 11,13 * * *") m=filings ;;
                *) m=prices ;;
              esac ;;
            workflow_dispatch) m="${{ inputs.mode }}" ;;
            *) m=deploy-only ;;
          esac
          echo "mode=$m" >> "$GITHUB_OUTPUT"

      - name: Run the tests
        run: node tools/test.js && node tools/e2e.js

      - name: Send a test email
        if: steps.mode.outputs.mode == 'test-email'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node tools/mail.js

      - name: Send a test WhatsApp message
        if: steps.mode.outputs.mode == 'test-whatsapp'
        env:
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
        run: node tools/whatsapp.js

      - name: Set up and test Telegram
        if: steps.mode.outputs.mode == 'test-telegram'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          T=$(printf %s "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')
          curl -sS -4 -m 20 -o /dev/null -w "Bot token check with curl: HTTP %{http_code} (200 = token accepted, 401 or 404 = wrong token)\n" "https://api.telegram.org/bot$T/getMe" || echo "api.telegram.org NOT reachable with curl"
          node tools/telegram.js

      - name: Update data and send alerts
        if: steps.mode.outputs.mode != 'deploy-only' && !startsWith(steps.mode.outputs.mode, 'test-')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
        run: node tools/ci.js "${{ steps.mode.outputs.mode }}" .

      - name: Save data to the repository
        if: steps.mode.outputs.mode != 'deploy-only' && !startsWith(steps.mode.outputs.mode, 'test-')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json prices.json state.json
          [ -f targets.json ] && git add targets.json
          [ -f filings.json ] && git add filings.json
          git diff --cached --quiet && exit 0
          git commit -m "Data update (${{ steps.mode.outputs.mode }})"
          git pull --rebase
          git push

      - name: Build site folder
        if: "!startsWith(steps.mode.outputs.mode, 'test-')"
        run: mkdir _site && cp index.html engine.js data.json prices.json _site/ && { [ ! -f targets.json ] || cp targets.json _site/; }
      - uses: actions/configure-pages@v5
        if: "!startsWith(steps.mode.outputs.mode, 'test-')"
      - uses: actions/upload-pages-artifact@v3
        if: "!startsWith(steps.mode.outputs.mode, 'test-')"
        with:
          path: _site
      - id: deploy
        if: "!startsWith(steps.mode.outputs.mode, 'test-')"
        uses: actions/deploy-pages@v4
